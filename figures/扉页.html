<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>心经通释 扉页</title>
<style>
  @page { size: 1240px 1754px; margin: 0; }
  html,body{margin:0;padding:0;background:#EFE7D8;}
  .page{
    position:relative;width:1240px;height:1754px;box-sizing:border-box;
    background:#F7F2E6;
    background-image:repeating-linear-gradient(90deg, rgba(120,96,64,.016) 0 1px, transparent 1px 7px);
    font-family:'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif;
    color:#26221E;overflow:hidden;
  }
  .page::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 150px rgba(120,96,64,.08);}
  .rule{position:absolute;height:1px;background:#CBB49B;}

  .series{position:absolute;top:210px;left:0;right:0;text-align:center;
    font-size:15px;letter-spacing:.4em;color:#8A6F52;text-indent:.4em;}
  .series-rule{top:266px;left:440px;width:360px;opacity:.7;}

  .title{position:absolute;top:452px;left:0;right:0;text-align:center;
    font-size:104px;font-weight:600;letter-spacing:.16em;text-indent:.16em;line-height:1.2;}
  .subtitle{position:absolute;top:616px;left:0;right:0;text-align:center;
    font-size:21px;letter-spacing:.26em;color:#6E5D4A;text-indent:.26em;}
  .sub-rule{top:686px;left:520px;width:200px;opacity:.55;}

  .motto{position:absolute;top:772px;left:0;right:0;text-align:center;
    font-size:17px;line-height:2.3;color:#5E5142;letter-spacing:.12em;}
  .motto .src{display:block;margin-top:16px;font-size:12.5px;letter-spacing:.24em;color:#9C8A76;}

  .author{position:absolute;top:1046px;left:0;right:0;text-align:center;
    font-size:26px;letter-spacing:.12em;color:#2A2622;}
  .edition{position:absolute;top:1104px;left:0;right:0;text-align:center;
    font-size:13.5px;letter-spacing:.22em;color:#94836F;line-height:2.2;}

  .bottom-rule{top:1600px;left:180px;width:880px;opacity:.5;}
  .imprint{position:absolute;top:1642px;left:0;right:0;text-align:center;
    font-size:12px;letter-spacing:.3em;color:#A2917C;text-indent:.3em;}
  .seal{position:absolute;top:1588px;left:576px;width:88px;height:88px;background:#A3402C;
    color:#FBF3E6;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
    font-size:28px;line-height:1.12;opacity:.88;}
  .seal span{width:50%;text-align:center;}
</style>
</head>
<body>
<div class="page">
  <div class="series">润 泽 说 · 道 可 道 · 第 二 部 觉 醒</div>
  <div class="rule series-rule"></div>

  <div class="title">心经通释</div>
  <div class="subtitle">般若纲宗 · 心性总诀 · 万古安心之经</div>
  <div class="rule sub-rule"></div>

  <div class="motto">
    凡所有相，皆是虚妄；若见诸相非相，即见如来。
    <span class="src">《金刚经》</span>
  </div>

  <div class="author">润泽　著</div>
  <div class="edition">稿本 · 岁次丙午 · 冬月<br>润泽说 · 道可道 第二部</div>

  <div class="rule bottom-rule"></div>
  <div class="imprint">心 经 通 释　·　润 泽 说 道 可 道</div>
</div>
</body>
</html>
